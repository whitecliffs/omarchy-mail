[package]
name = "omarchy-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A calm, native email client for Omarchy"
license = "MIT"
repository = "https://github.com/whitecliffs/omarchy-mail"

[dependencies]
adw = { package = "libadwaita", version = "0.8" }
async-channel = "2.5"
ammonia = "4.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
gio = "0.21"
glib = "0.21"
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
webkit6 = { version = "0.5", features = ["v2_50"] }
imap = "2.4"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.15"
native-tls = "0.2"
notify-rust = "4.11"
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
